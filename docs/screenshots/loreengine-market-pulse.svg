<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">LoreEngine market pulse preview</title>
  <desc id="desc">Market Pulse preview showing hardware, engine, and gaming revenue watchlists.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071721"/>
      <stop offset="0.55" stop-color="#080b14"/>
      <stop offset="1" stop-color="#15112f"/>
    </linearGradient>
    <linearGradient id="pos" x1="0" x2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="neg" x1="0" x2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <g transform="translate(72 58)">
    <text x="0" y="30" fill="#9cf6ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="5">MARKET PULSE</text>
    <text x="0" y="94" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="900">Gaming market watchlists</text>
    <text x="0" y="140" fill="#b8c4d6" font-family="Inter, Arial, sans-serif" font-size="23">Weekly close-price context for hardware, engines, and game revenue leaders.</text>
  </g>
  <g transform="translate(72 230)">
    <rect width="1296" height="154" rx="26" fill="#09101d" stroke="#26364f"/>
    <g transform="translate(34 30)">
      <text x="0" y="24" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="4">AVG 30D</text>
      <text x="0" y="88" fill="#fb7185" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900">-1.2%</text>
    </g>
    <g transform="translate(300 30)">
      <text x="0" y="24" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="4">HARDWARE SIGNALS</text>
      <text x="0" y="88" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900">5</text>
    </g>
    <g transform="translate(626 30)">
      <text x="0" y="24" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="4">GAME ENGINES</text>
      <text x="0" y="88" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900">2</text>
    </g>
    <g transform="translate(916 30)">
      <text x="0" y="24" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="4">REVENUE LEADERS</text>
      <text x="0" y="88" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900">10</text>
    </g>
  </g>
  <g transform="translate(72 430)">
    <rect width="1296" height="94" rx="22" fill="#0a101c" stroke="#26364f"/>
    <text x="28" y="38" fill="#9cf6ff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="4">HARDWARE</text>
    <text x="28" y="68" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">NVIDIA, AMD, Intel, Qualcomm, Corsair</text>
    <path d="M820 64 C880 28 930 78 990 42 C1042 10 1104 72 1174 34" fill="none" stroke="url(#pos)" stroke-width="6" stroke-linecap="round"/>
    <text x="1200" y="58" fill="#34d399" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">+31.9%</text>
  </g>
  <g transform="translate(72 550)">
    <rect width="1296" height="94" rx="22" fill="#0a101c" stroke="#26364f"/>
    <text x="28" y="38" fill="#c4b5fd" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="4">GAME ENGINES</text>
    <text x="28" y="68" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">Unity plus Epic as Unreal proxy</text>
    <path d="M820 40 C880 72 930 28 990 54 C1056 82 1112 44 1174 62" fill="none" stroke="url(#neg)" stroke-width="6" stroke-linecap="round"/>
    <text x="1200" y="58" fill="#fb7185" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">-4.8%</text>
  </g>
  <g transform="translate(72 670)">
    <rect width="1296" height="94" rx="22" fill="#0a101c" stroke="#26364f"/>
    <text x="28" y="38" fill="#86efac" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="4">GAME REVENUE</text>
    <text x="28" y="62" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">Tencent, NetEase, Roblox, Take-Two, EA, Krafton, Ubisoft</text>
    <text x="28" y="88" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">plus CD Projekt, Konami, and Capcom</text>
    <path d="M820 66 C876 40 936 72 998 30 C1058 8 1118 58 1174 36" fill="none" stroke="url(#pos)" stroke-width="6" stroke-linecap="round"/>
    <text x="1200" y="58" fill="#34d399" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">+8.4%</text>
  </g>
  <text x="72" y="832" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">Informational only. Weekly cached close-price data with fallback snapshots.</text>
</svg>
