    <text x="28" y="46" fill="#9cf6ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="3">MARKET PULSE</text>
    <text x="28" y="94" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="900">INTC +31.9%</text>
    <path d="M28 172 C84 118 128 200 184 144 C230 96 270 160 332 110" fill="none" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="332" cy="110" r="9" fill="#67e8f9"/>
    <text x="28" y="224" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">Weekly cached market context</text>
