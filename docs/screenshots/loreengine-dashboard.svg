      <rect x="28" y="30" width="84" height="8" rx="4" fill="#fbbf24" opacity="0.35"/>
      <text x="28" y="76" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="4">MOMENTUM</text>
      <text x="28" y="124" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">+36%</text>
