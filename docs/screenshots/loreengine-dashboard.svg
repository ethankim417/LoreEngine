      <rect width="294" height="150" rx="22" fill="#0b1324" stroke="#26364f"/>
      <rect x="28" y="30" width="84" height="8" rx="4" fill="#a78bfa" opacity="0.35"/>
      <text x="28" y="76" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="4">AI INDEX</text>
      <text x="28" y="124" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">85/100</text>
