    <text x="28" y="170" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="20">Steam library access, Linux flexibility, and PC openness</text>
    <text x="28" y="200" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="20">become a premium-price test.</text>
    <rect x="28" y="218" width="170" height="34" rx="12" fill="#0f1c2d" stroke="#164e63"/>
    <text x="48" y="241" fill="#bae6fd" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Impact 91</text>
    <rect x="214" y="218" width="170" height="34" rx="12" fill="#0f1c2d" stroke="#164e63"/>
    <text x="234" y="241" fill="#bae6fd" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Momentum +45%</text>
