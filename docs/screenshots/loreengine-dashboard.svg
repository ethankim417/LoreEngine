    <text x="0" y="92" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="900">Weekly gaming intelligence</text>
    <text x="0" y="140" fill="#b6c2d4" font-family="Inter, Arial, sans-serif" font-size="24">A cached brief for game AI, platforms, studios, hardware, esports,</text>
    <text x="0" y="174" fill="#b6c2d4" font-family="Inter, Arial, sans-serif" font-size="24">and market signals.</text>
    <rect x="0" y="210" width="216" height="52" rx="18" fill="#67e8f9"/>
    <text x="28" y="244" fill="#07111f" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900">15 briefs tracked</text>
    <rect x="236" y="210" width="184" height="52" rx="18" fill="#101827" stroke="#2dd4bf" opacity="0.95"/>
    <text x="264" y="244" fill="#ccfbf1" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">9 sources used</text>
  </g>

  <g transform="translate(72 340)">
    <g>
      <rect width="294" height="150" rx="22" fill="#0b1324" stroke="#26364f"/>
      <rect x="28" y="30" width="84" height="8" rx="4" fill="#22d3ee" opacity="0.35"/>
      <text x="28" y="76" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="4">INDUSTRY HEAT</text>
      <text x="28" y="124" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">82/100</text>
