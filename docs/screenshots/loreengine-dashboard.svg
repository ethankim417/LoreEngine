<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">LoreEngine dashboard preview</title>
  <desc id="desc">Portfolio preview of the LoreEngine weekly gaming industry intelligence dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#061923"/>
      <stop offset="0.5" stop-color="#070914"/>
      <stop offset="1" stop-color="#160d2f"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <g opacity="0.2">
    <path d="M0 160H1440M0 320H1440M0 480H1440M0 640H1440M0 800H1440" stroke="#7dd3fc"/>
    <path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900" stroke="#7dd3fc"/>
  </g>
  <circle cx="1130" cy="40" r="260" fill="#7c3aed" opacity="0.18" filter="url(#glow)"/>
  <circle cx="150" cy="120" r="260" fill="#06b6d4" opacity="0.18" filter="url(#glow)"/>

  <g transform="translate(72 64)">
