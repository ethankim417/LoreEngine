  <g transform="translate(72 552)">
    <rect width="820" height="250" rx="26" fill="#070b14" stroke="#243650"/>
    <text x="28" y="46" fill="#86efac" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="3">READ FIRST</text>
    <text x="28" y="94" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="900">Valve prices Steam Machine</text>
