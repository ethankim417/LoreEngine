<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1200" viewBox="0 0 720 1200" role="img" aria-labelledby="title desc">
  <title id="title">LoreEngine mobile preview</title>
  <desc id="desc">Mobile preview of the LoreEngine dashboard with compact brief cards and bottom navigation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#061923"/>
      <stop offset="0.55" stop-color="#070914"/>
      <stop offset="1" stop-color="#170d2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1200" fill="url(#bg)"/>
  <rect x="46" y="34" width="628" height="1132" rx="54" fill="#030712" stroke="#26364f" stroke-width="4"/>
  <rect x="72" y="76" width="576" height="1022" rx="34" fill="#07101c"/>
  <g transform="translate(96 116)">
    <text x="0" y="22" fill="#9cf6ff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="4">LOREENGINE</text>
    <text x="0" y="78" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900">Weekly gaming</text>
    <text x="0" y="126" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900">intelligence</text>
    <text x="0" y="170" fill="#b8c4d6" font-family="Inter, Arial, sans-serif" font-size="20">Mobile-ready command brief for games, AI, and markets.</text>
    <rect x="0" y="212" width="162" height="44" rx="16" fill="#67e8f9"/>
    <text x="23" y="241" fill="#07111f" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900">Read brief</text>
    <rect x="178" y="212" width="168" height="44" rx="16" fill="#101827" stroke="#164e63"/>
    <text x="202" y="241" fill="#bae6fd" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900">9 sources</text>
  </g>
  <g transform="translate(96 420)">
    <rect width="528" height="118" rx="24" fill="#0a1322" stroke="#26364f"/>
    <text x="24" y="46" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="3">INDUSTRY HEAT</text>
    <text x="24" y="94" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">82/100</text>
    <rect x="370" y="38" width="110" height="40" rx="14" fill="#10243a" stroke="#155e75"/>
    <text x="393" y="64" fill="#bae6fd" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900">+11 pts</text>
  </g>
  <g transform="translate(96 572)">
    <rect width="528" height="282" rx="26" fill="#070b14" stroke="#26364f"/>
    <rect x="24" y="28" width="116" height="34" rx="13" fill="#0d2f27" stroke="#166534"/>
    <text x="43" y="51" fill="#bbf7d0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="900">READ FIRST</text>
    <text x="24" y="104" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="900">Valve prices Steam</text>
    <text x="24" y="142" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="900">Machine above the</text>
    <text x="24" y="180" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="900">console market</text>
    <text x="24" y="226" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="18">Premium pricing turns Valve's living-room PC</text>
    <text x="24" y="254" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="18">into a strategy signal for SteamOS.</text>
  </g>
  <g transform="translate(96 886)">
    <rect width="528" height="102" rx="24" fill="#0a1322" stroke="#26364f"/>
    <text x="24" y="42" fill="#9cf6ff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="3">MARKET PULSE</text>
    <path d="M272 68 C314 40 348 78 394 50 C432 28 466 66 504 44" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <text x="24" y="78" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">INTC +31.9%</text>
  </g>
  <g transform="translate(96 1022)">
    <rect width="528" height="58" rx="22" fill="#0b1324" stroke="#26364f"/>
    <text x="54" y="37" fill="#9cf6ff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900">Brief</text>
    <text x="172" y="37" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900">Market</text>
    <text x="314" y="37" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900">Filters</text>
    <text x="452" y="37" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900">Top</text>
  </g>
</svg>
